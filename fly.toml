# Multi-tenant Oura HTTP MCP server. Scale-to-zero: the machine stops when idle
# and cold-starts (~1-3s) on the first request. No periodic health check — one
# would keep the machine awake and defeat scale-to-zero.
app = "lifeos-oura"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

# Per-owner token store (tenants.json) persists here across restarts/scale-to-zero.
[[mounts]]
  source = "oura_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  PORT = "8080"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
